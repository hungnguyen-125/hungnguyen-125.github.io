    Research Experience:
      - company: VinMotion
        position: Humanoid Robotics Controls Intern
        location: Hanoi, Vietnam
        start_date: 2025-06
        end_date: 2025-08
        highlights:
          - "Tuned stance–swing contact constraints and MPC QP weighting matrices in a rigid-body MPC framework for the Motion1 humanoid robot, contributing to stair climbing and fast walking at up to 0.6 m/s during real-robot experiments."
          - "Investigated and designed a contact-schedule-based gait-transition strategy for the NMPC locomotion planner, representing gaits as sequences of stance, swing, and flight phases to improve transition smoothness over the existing finite-state-machine approach."

      - company: LURPA — ENS Paris-Saclay
        position: Research Intern — Bachelor Thesis Internship
        location: Paris, France
        start_date: 2024-04
        end_date: 2024-08
        highlights:
          - "Investigated controller reconstruction in Discrete Event Systems through system identification, with the objective of recovering control logic from observed system behavior."
          - "Derived conditions under which an identified model can be used for exact controller reconstruction."
          - "Developed an algorithm for automatically synthesizing controllers from observed data."

      - company: iRobot — Laboratory of Intelligent Robot, Hanoi University of Industry
        position: Research Assistant
        location: Hanoi, Vietnam
        start_date: 2023-08
        end_date: 2025-06
        highlights:
          - "Implemented and evaluated PID, nonlinear PID, and fuzzy-PID controllers on nonlinear and underactuated robotic systems, including two-wheel balancing robots, Pendubot, and Ballbot."
          - "Evaluated Type-1 fuzzy controllers on a 6-DOF robotic manipulator in simulation, integrating admittance control for human–robot interaction scenarios."
          - "Applied Genetic Algorithms for controller parameter tuning and performance optimization."

    Selected Projects:
      - name: Safe Formation Control for Multi-Robot Systems
        start_date: 2026-02
        end_date: 2026-08
        summary: Semester project at Université Paris-Saclay.
        highlights:
          - "Implemented a distributed consensus-based formation controller for double-integrator multi-robot systems using local neighbor information."
          - "Implemented two independent CBF-based QP safety filters, including Relaxed Distributed CBF (RDCBF) and High-Order CBF (HOCBF), for inter-agent and obstacle collision avoidance."
          - "Validated the approach in collision-prone simulations, including 19-agent position swapping and 6-drone formation under disturbances."

      - name: Differential-Drive Autonomous Guided Vehicle
        start_date: 2023-11
        end_date: 2024-02
        highlights:
          - "Implemented an Extended Kalman Filter (EKF) for state estimation and localization using encoder, IMU, and LiDAR measurements."
          - "Developed a PID-based trajectory-tracking controller to follow reference trajectories generated from joystick commands."
          - "Integrated YOLOv8-based perception for human detection."

